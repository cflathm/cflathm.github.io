</style></head><body><main><h1>AI + people</h1><p>Four concept sketches, reviewed on the site's dark and light surfaces.</p><div class="grid"><article class="hero-study"><header><span>ALL</span><h2>AI supports people working together</h2></header><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" fill="none" role="img" aria-labelledby="study-overview-title" aria-describedby="study-overview-desc" class="system-diagram work-figure technical-figure hero-diagram playbook-figure" data-figure="overview" data-figure-option="playbook">
  <title id="study-overview-title">A game plan for AI supporting the work between people</title>
  <desc id="study-overview-desc">Three circled human figures form a triangle on a coach's board. Direct two-way routes connect the people. AI support sits beside three activities on these routes: sharing knowledge, blocking cognitive risk, and coordinating handoffs. A blue shield intercepts a coral risk cross, and blue coaching circles mark knowledge and handoff artifacts. People remain directly connected. The playbook is a visual metaphor for design goals, not a deployed architecture or measured result.</desc>

.playbook-figure {
  --pb-board: #15372e;
  --pb-chalk: #f1f0dc;
  --pb-muted: #bdccbd;
  --pb-grid: #416252;
  --pb-ai: #9ecdfc;
  --pb-ai-fill: #1c4351;
  --pb-risk: #ffa68f;
  --pb-note: #e8d08a;
  display: block;
  width: 100%;
  height: auto;
}
.playbook-figure .pb-board {
  fill: var(--pb-board);
  stroke: #638170;
  stroke-width: 1;
}
.playbook-figure .pb-rule {
  stroke: var(--pb-grid);
  stroke-width: 1;
}
.playbook-figure .pb-field {
  stroke: var(--pb-grid);
  stroke-width: 1;
  fill: none;
}
.playbook-figure .pb-index {
  fill: none;
  stroke: var(--pb-note);
  stroke-width: 1.5;
}
.playbook-figure .pb-number {

</article><article class=""><header><span>01</span><h2>Shared knowledge</h2></header><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" fill="none" role="img" aria-labelledby="study-knowledge-title" aria-describedby="study-knowledge-desc" class="system-diagram work-figure technical-figure playbook-figure" data-figure="knowledge" data-figure-option="playbook">
  <title id="study-knowledge-title">Bring shared knowledge into collective judgement</title>
  <desc id="study-knowledge-desc">On a coach's board, three circled people hold experience, context, and evidence. Their routes join at one clean junction and reach a decision point marked by a clock. AI support links who knows what with when that knowledge is needed. The route continues to a human huddle where people weigh perspectives and form collective judgement. An amber return route sends learning from the outcome back to the knowledge network. The formations and routes are a playbook metaphor, not a fixed workflow or system architecture.</desc>

.playbook-figure {
  --pb-board: #15372e;
  --pb-chalk: #f1f0dc;
  --pb-muted: #bdccbd;
  --pb-grid: #416252;
  --pb-ai: #9ecdfc;
  --pb-ai-fill: #1c4351;
  --pb-risk: #ffa68f;
  --pb-note: #e8d08a;
  display: block;
  width: 100%;
  height: auto;
}
.playbook-figure .pb-board {
  fill: var(--pb-board);
  stroke: #638170;
  stroke-width: 1;
}
.playbook-figure .pb-rule {
  stroke: var(--pb-grid);
  stroke-width: 1;
}
.playbook-figure .pb-field {
  stroke: var(--pb-grid);
  stroke-width: 1;
  fill: none;
}
.playbook-figure .pb-index {
  fill: none;
  stroke: var(--pb-note);
  stroke-width: 1.5;
}
.playbook-figure .pb-number {
  fill: var(--pb-note);
  font: 600 15px monospace;
  text-anchor: middle;
}
.playbook-figure .pb-title {
  fill: var(--pb-chalk);
  font:
    400 28px 'Kalam',
    cursive;
}
.playbook-figure .pb-tag {
  fill: var(--pb-muted);
  font: 400 13px monospace;
  letter-spacing: 1.5px;
  text-anchor: end;
}
.playbook-figure .pb-route {
  stroke: var(--pb-chalk);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}
.playbook-figure .pb-link {
  stroke: var(--pb-chalk);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}
.playbook-figure .pb-return {
  stroke: var(--pb-note);
  stroke-width: 2.3;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}
.playbook-figure .pb-ai-line {
  stroke: var(--pb-ai);
  stroke-width: 2;
  stroke-dasharray: 4 6;
  stroke-linecap: round;
  fill: none;
}
.playbook-figure .pb-coach-ring {
  stroke: var(--pb-ai);
  stroke-width: 2.4;
  stroke-linecap: round;
  fill: none;
}
.playbook-figure .pb-badge {
  fill: var(--pb-ai-fill);
  stroke: var(--pb-ai);
  stroke-width: 1.7;
}
.playbook-figure .pb-ai {
  fill: var(--pb-ai);
  font: 600 23px var(--body, 'Source Sans 3 Variable', Arial, sans-serif);
  text-anchor: middle;
}
.playbook-figure .pb-label {
  fill: var(--pb-chalk);
  font: 400 23px var(--body, 'Source Sans 3 Variable', Arial, sans-serif);
  paint-order: stroke;
  stroke: var(--pb-board);
  stroke-width: 5;
  stroke-linejoin: round;
}
.playbook-figure .pb-heading {
  fill: var(--pb-chalk);
  font: 600 24px var(--body, 'Source Sans 3 Variable', Arial, sans-serif);
  paint-order: stroke;
  stroke: var(--pb-board);
  stroke-width: 5;
}
.playbook-figure .pb-small {
  fill: var(--pb-muted);
  font: 400 18px var(--body, 'Source Sans 3 Variable', Arial, sans-serif);
}
.playbook-figure .pb-note {
  fill: var(--pb-note);
  font:
    400 26px 'Kalam',
    cursive;
  paint-order: stroke;
  stroke: var(--pb-board);
  stroke-width: 5;
  stroke-linejoin: round;
}
.playbook-figure .pb-work {
  fill: var(--pb-board);
  stroke: var(--pb-chalk);
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.playbook-figure .pb-team {
  fill: none;
  stroke: var(--pb-muted);
  stroke-width: 1.4;
  stroke-linecap: round;
}
.playbook-figure .pb-risk {
  stroke: var(--pb-risk);
  stroke-width: 3.6;
  stroke-linecap: round;
  fill: none;
}
.playbook-figure .pb-risk-route {
  stroke: var(--pb-risk);
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-dasharray: 5 6;
  fill: none;
}
.playbook-figure .pb-block {
  stroke: var(--pb-ai);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}
@media print {
  .playbook-figure {
    print-color-adjust: exact;
  }
}

.playbook-figure {
  --pb-board: #15372e;
  --pb-chalk: #f1f0dc;
  --pb-muted: #bdccbd;
  --pb-grid: #416252;
  --pb-ai: #9ecdfc;
  --pb-ai-fill: #1c4351;
  --pb-risk: #ffa68f;
  --pb-note: #e8d08a;
  display: block;
  width: 100%;
  height: auto;
}
.playbook-figure .pb-board {
  fill: var(--pb-board);
  stroke: #638170;
  stroke-width: 1;
}
.playbook-figure .pb-rule {
  stroke: var(--pb-grid);
  stroke-width: 1;
}
.playbook-figure .pb-field {
  stroke: var(--pb-grid);
  stroke-width: 1;
  fill: none;
}
.playbook-figure .pb-index {
  fill: none;
  stroke: var(--pb-note);
  stroke-width: 1.5;
}
.playbook-figure .pb-number {
  fill: var(--pb-note);
  font: 600 15px monospace;
  text-anchor: middle;
}
.playbook-figure .pb-title {
  fill: var(--pb-chalk);
  font:
    400 28px 'Kalam',
    cursive;
}
.playbook-figure .pb-tag {
  fill: var(--pb-muted);
  font: 400 13px monospace;
  letter-spacing: 1.5px;
  text-anchor: end;
}
.playbook-figure .pb-route {
  stroke: var(--pb-chalk);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}
.playbook-figure .pb-link {
  stroke: var(--pb-chalk);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}
.playbook-figure .pb-return {
  stroke: var(--pb-note);
  stroke-width: 2.3;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}
.playbook-figure .pb-ai-line {
  stroke: var(--pb-ai);
  stroke-width: 2;
  stroke-dasharray: 4 6;
  stroke-linecap: round;
  fill: none;
}
.playbook-figure .pb-coach-ring {
  stroke: var(--pb-ai);
  stroke-width: 2.4;
  stroke-linecap: round;
  fill: none;
}
.playbook-figure .pb-badge {
  fill: var(--pb-ai-fill);
  stroke: var(--pb-ai);
  stroke-width: 1.7;
}
.playbook-figure .pb-ai {
  fill: var(--pb-ai);
  font: 600 23px var(--body, 'Source Sans 3 Variable', Arial, sans-serif);
  text-anchor: middle;
}
.playbook-figure .pb-label {
  fill: var(--pb-chalk);
  font: 400 23px var(--body, 'Source Sans 3 Variable', Arial, sans-serif);
  paint-order: stroke;
  stroke: var(--pb-board);
  stroke-width: 5;
  stroke-linejoin: round;
}
.playbook-figure .pb-heading {
  fill: var(--pb-chalk);
  font: 600 24px var(--body, 'Source Sans 3 Variable', Arial, sans-serif);
  paint-order: stroke;
  stroke: var(--pb-board);
  stroke-width: 5;
}
.playbook-figure .pb-small {
  fill: var(--pb-muted);
  font: 400 18px var(--body, 'Source Sans 3 Variable', Arial, sans-serif);
}
.playbook-figure .pb-note {
  fill: var(--pb-note);
  font:
    400 26px 'Kalam',
    cursive;
  paint-order: stroke;
  stroke: var(--pb-board);
  stroke-width: 5;
  stroke-linejoin: round;
}
.playbook-figure .pb-work {
  fill: var(--pb-board);
  stroke: var(--pb-chalk);
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.playbook-figure .pb-team {
  fill: none;
  stroke: var(--pb-muted);
  stroke-width: 1.4;
  stroke-linecap: round;
}
.playbook-figure .pb-risk {
  stroke: var(--pb-risk);
  stroke-width: 3.6;
  stroke-linecap: round;
  fill: none;
}
.playbook-figure .pb-risk-route {
  stroke: var(--pb-risk);
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-dasharray: 5 6;
  fill: none;
}
.playbook-figure .pb-block {
  stroke: var(--pb-ai);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}
@media print {
  .playbook-figure {
    print-color-adjust: exact;
  }
}

  <title id="study-coordination-title">AI supports handoffs and coordination between teams</title>
  <desc id="study-coordination-desc">Three team formations each contain two circled people. Direct two-way chalk routes connect the teams across the coach's board. A handoff on one route is circled in blue. AI support beside that route points to both the handoff and a shared plan listing decisions, handoffs, and next steps. Teams retain direct relationships. The playbook routes illustrate coordination goals, not a specified workflow or deployed system.</desc>

.playbook-figure {
  --pb-board: #15372e;
  --pb-chalk: #f1f0dc;
  --pb-muted: #bdccbd;
  --pb-grid: #416252;
  --pb-ai: #9ecdfc;
  --pb-ai-fill: #1c4351;
  --pb-risk: #ffa68f;
  --pb-note: #e8d08a;
  display: block;
  width: 100%;
  height: auto;
}
.playbook-figure .pb-board {
  fill: var(--pb-board);
  stroke: #638170;
  stroke-width: 1;
}
.playbook-figure .pb-rule {
  stroke: var(--pb-grid);
  stroke-width: 1;
}
.playbook-figure .pb-field {
  stroke: var(--pb-grid);
  stroke-width: 1;
  fill: none;
}
.playbook-figure .pb-index {
  fill: none;
  stroke: var(--pb-note);
  stroke-width: 1.5;
}
