<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" fill="none" role="img" aria-labelledby="FIGURE-title" aria-describedby="FIGURE-desc" class="system-diagram work-figure technical-figure playbook-figure" data-figure="coordination" data-figure-option="playbook">
  <title id="FIGURE-title">AI supports handoffs and coordination between teams</title>
  <desc id="FIGURE-desc">Three team formations each contain two circled people. Direct two-way chalk routes connect the teams across the coach's board. A handoff on one route is circled in blue. AI support beside that route points to both the handoff and a shared plan listing decisions, handoffs, and next steps. Teams retain direct relationships. The playbook routes illustrate coordination goals, not a specified workflow or deployed system.</desc>
