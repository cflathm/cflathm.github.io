<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" fill="none" role="img" aria-labelledby="FIGURE-title" aria-describedby="FIGURE-desc" class="system-diagram work-figure technical-figure playbook-figure" data-figure="overview" data-figure-option="playbook">
  <title id="FIGURE-title">A game plan for AI supporting the work between people</title>
  <desc id="FIGURE-desc">Three circled human figures form a triangle on a coach's board. Direct two-way routes connect the people. AI support sits beside three activities on these routes: sharing knowledge, blocking cognitive risk, and coordinating handoffs. A blue shield intercepts a coral risk cross, and blue coaching circles mark knowledge and handoff artifacts. People remain directly connected. The playbook is a visual metaphor for design goals, not a deployed architecture or measured result.</desc>
