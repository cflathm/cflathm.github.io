<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none" role="img" aria-labelledby="FIGURE-title" aria-describedby="FIGURE-desc" class="system-diagram work-figure technical-figure" data-figure="knowledge">
  <title id="FIGURE-title">Use shared knowledge to form collective judgement</title>
  <desc id="FIGURE-desc">The drawing connects three questions: who knows what, when that knowledge is needed, and how collective judgement forms. People hold complementary experience, context, and evidence. Their knowledge is brought into a decision point, then people discuss and weigh those perspectives together. A return route shows learning from the outcome updating shared knowledge. AI supports linking expertise with the moment of need; the judgement remains a human, collective activity. This is a conceptual model, not a specified system architecture or fixed workflow.</desc>
  <defs>
    <symbol id="FIGURE-person" viewBox="0 0 52 64"><circle cx="26" cy="16" r="9" fill="var(--f-paper,#f5f6f3)" stroke="var(--f-ink,#283b50)" stroke-width="2.1"/><path d="M8 59V48c0-11 7-17 18-17s18 6 18 17v11H8Z" fill="var(--f-paper,#f5f6f3)" stroke="var(--f-ink,#283b50)" stroke-width="2.1" stroke-linejoin="round"/></symbol>
    <marker id="FIGURE-arrow" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="m3 2 7 5-7 5" stroke="var(--f-line,#426355)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text x="300" y="38" text-anchor="middle" class="cf-title">Shared knowledge in use</text>
  <g class="cf-heading" text-anchor="middle"><text x="124" y="94"><tspan x="124">Who knows</tspan><tspan x="124" dy="28">what</tspan></text><text x="277" y="94"><tspan x="277">When it's</tspan><tspan x="277" dy="28">needed</tspan></text><text x="483" y="94"><tspan x="483">Collective</tspan><tspan x="483" dy="28">judgement</tspan></text></g>
