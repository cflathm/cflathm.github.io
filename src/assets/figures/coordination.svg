  <path d="m382 342 4 4 7-8m-11 26 4 4 7-8m-11 26 4 4 7-8" class="cf-connection"/><g class="cf-small"><text x="405" y="349">Decisions</text><text x="405" y="371">Handoffs</text><text x="405" y="393">Next steps</text></g>
