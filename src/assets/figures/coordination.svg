<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none" role="img" aria-labelledby="FIGURE-title" aria-describedby="FIGURE-desc" class="system-diagram work-figure technical-figure" data-figure="coordination">
  <title id="FIGURE-title">Help teams coordinate handoffs and shared work</title>
  <desc id="FIGURE-desc">Three teams, each shown as a pair of people in a loosely drawn oval, connect directly through two-way green routes. A routed handoff between two teams is circled in blue. An AI support marker points to that handoff and a shared plan listing decisions, handoffs, and next steps. The drawing borrows playbook route and coaching marks while showing coordination across people. It is conceptual, not a workflow specification or deployed architecture.</desc>
  <defs>
    <symbol id="FIGURE-person" viewBox="0 0 52 64"><circle cx="26" cy="16" r="9" fill="var(--f-paper,#f5f6f3)" stroke="var(--f-ink,#283b50)" stroke-width="2.1"/><path d="M8 59V48c0-11 7-17 18-17s18 6 18 17v11H8Z" fill="var(--f-paper,#f5f6f3)" stroke="var(--f-ink,#283b50)" stroke-width="2.1" stroke-linejoin="round"/></symbol>
    <marker id="FIGURE-arrow" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="m3 2 7 5-7 5" stroke="var(--f-line,#426355)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text x="300" y="45" text-anchor="middle" class="cf-title">Coordinate across teams</text>
  <g class="cf-network"><path d="M42 123c12-32 87-40 116-12 31 28 20 75-33 82-59 8-103-26-83-70Z"/><path d="M42 319c12-32 87-40 116-12 31 28 20 75-33 82-59 8-103-26-83-70Z"/><path d="M405 123c12-32 87-40 116-12 31 28 20 75-33 82-59 8-103-26-83-70Z"/></g>
  <g class="cf-connection" marker-start="url(#FIGURE-arrow)" marker-end="url(#FIGURE-arrow)"><path d="M185 146c64-29 145-29 208 0"/><path d="M104 210v45"/><path d="M184 337h15q23 0 39-27l88-118q15-22 67-24"/></g>
  <path d="M185 356h169M471 210v62" class="cf-network"/>
  <use href="#FIGURE-person" x="60" y="116" width="45" height="56"/><use href="#FIGURE-person" x="103" y="122" width="45" height="56"/><use href="#FIGURE-person" x="60" y="312" width="45" height="56"/><use href="#FIGURE-person" x="103" y="318" width="45" height="56"/><use href="#FIGURE-person" x="423" y="116" width="45" height="56"/><use href="#FIGURE-person" x="466" y="122" width="45" height="56"/>
  <g class="cf-label" text-anchor="middle"><text x="105" y="91">Team 1</text><text x="105" y="287">Team 2</text><text x="468" y="91">Team 3</text></g>
