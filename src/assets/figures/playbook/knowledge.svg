  <circle cx="302" cy="180" r="19" class="pb-work"/><path d="M302 168v13l10 6" class="pb-link"/><text x="302" y="226" text-anchor="middle" class="pb-label" style="font-size:21px"><tspan x="302">Decision</tspan><tspan x="302" dy="23">point</tspan></text>
